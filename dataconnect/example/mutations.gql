# Update current user profile
mutation UpdateUserProfile($email: String!, $displayName: String, $organization: String) @auth(level: USER) {
  user_upsert(data: {
    id_expr: "auth.uid"
    email: $email
    displayName: $displayName
    organization: $organization
  })
}

